<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TaskFlow{% endblock %}</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #5b66ff, #0f172a);
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            background: rgba(15, 23, 42, 0.96);
            border-bottom: 1px solid rgba(148, 163, 184, 0.18);
        }

        .navbar-brand {
            font-weight: 700;
            color: #c7d2fe !important;
        }

        .navbar-nav .nav-link {
            color: #c7d2fe !important;
        }

        .navbar-nav .nav-link:hover {
            color: #a5b4fc !important;
        }

        .card,
        .card-body,
        .login-card,
        .register-card,
        .section-card,
        .dashboard-card,
        .modal-content {
            background: rgba(15, 23, 42, 0.92);
            border: 1px solid rgba(148, 163, 184, 0.16);
            color: #ffffff;
        }

        .card {
            box-shadow: 0 24px 60px rgba(15, 23, 42, 0.38);
        }

        .btn-primary {
            background: linear-gradient(135deg, #7c3aed, #2563eb);
            border: none;
            color: #ffffff;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #6d28d9, #1d4ed8);
            color: #ffffff;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.92);
            color: #1f2937;
            border: 1px solid rgba(15, 23, 42, 0.12);
        }

        .form-control,
        .form-select,
        input[type="text"],
        input[type="password"],
        input[type="email"] {
            background: rgba(208, 216, 228, 0.82);
            color: #111827;
            border: 1px solid rgba(148, 163, 184, 0.2);
        }

        .form-control::placeholder,
        .form-select::placeholder,
        input::placeholder {
            color: #334155 !important;
            opacity: 1;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #8b5cf6;
            box-shadow: 0 0 0 0.2rem rgba(124, 58, 237, 0.25);
        }

        .text-muted {
            color: inherit !important;
        }

        footer {
            margin-top: auto;
        }

        footer .container {
            color: #1f2937;
        }
    </style>

    {% block head %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">TaskFlow</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/auth/login">Login</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/auth/profile">Profile</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/projects">Projects</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/friends">Friends</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-5 flex-grow-1">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-white border-top py-4">
        <div class="container text-center">
            © 2026 TaskFlow
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
