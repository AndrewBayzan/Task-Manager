<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Projects</title>
</head>
<body>
    <div class="container mt-5">
        <h1>📁 Ваши проекты</h1>
        <p class="text-muted">Пользователь: <strong>{{ username }}</strong></p>
        
        <button class="btn btn-primary mb-4" data-bs-toggle="modal" data-bs-target="#createProjectModal">
        + Создать новый проект
        </button>

        <div class="modal fade" id="createProjectModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog">
                <form class="modal-content" method="post" action="/projects/create_project">
                <div class="modal-header">
                    <h5 class="modal-title">Новый проект</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                    <label class="form-label">Название проекта</label>
                    <input name="project_name" class="form-control" required maxlength="50">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                    <button type="submit" class="btn btn-primary">Создать</button>
                </div>
                </form>
            </div>
        </div>
        
        {% if projects %}
            <div class="row">
                {% for project in projects %}
                    <div class="col-md-6 col-lg-4 mb-4">
                        <div class="card h-100 shadow-sm">
                            <div class="card-body">
                                <h5 class="card-title">{{ project.project_name }}</h5>
                                <p class="card-text text-muted">ID: {{ project.id }}</p>
                            </div>
                            <div class="card-footer bg-white">
                                <a href="/projects/{{ project.id }}" class="btn btn-success w-100">
                                    Перейти →
                                </a>
                            </div>
                        </div>
                    </div>
                {% endfor %}
            </div>
        {% else %}
            <div class="alert alert-info text-center" role="alert">
                <h4>📭 У вас пока нет проектов</h4>
                <p>Создайте новый проект, чтобы начать работу</p>
            </div>
        {% endif %}
    </div>
        
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
